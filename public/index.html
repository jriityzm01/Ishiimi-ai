<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ishimi 大 - Multi AI & Downloader</title>
    <style>
        :root {
            --bg-sidebar: rgba(26, 17, 38, 0.95); --text-main: #e2d9f3; --text-muted: #9b8bb4; --accent: #a855f7; --border: rgba(168, 85, 247, 0.4);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0a0612; color: var(--text-main); height: 100vh; overflow: hidden; display: flex; }
        
        /* Background Video */
        #bg-video { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -2; }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(18, 12, 28, 0.7); z-index: -1; pointer-events: none; }

        /* ============ ANIMASI SPLASH & LOGIN ============ */
        #splashScreen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #0a0612; display: flex; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.8s ease;
        }
        .splash-title {
            font-size: 3rem; font-weight: bold; color: var(--accent);
            text-shadow: 0 0 20px var(--accent);
            animation: zoomIn 1.5s ease-out forwards;
        }
        @keyframes zoomIn {
            0% { transform: scale(0.5); opacity: 0; filter: blur(10px); }
            50% { transform: scale(1.1); opacity: 1; filter: blur(0); }
            100% { transform: scale(1); opacity: 1; }
        }

        #loginScreen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(10, 6, 18, 0.8); backdrop-filter: blur(10px);
            display: none; justify-content: center; align-items: center;
            z-index: 9000; opacity: 0; transition: opacity 0.5s ease;
            flex-direction: column;
        }
        .login-box {
            background: rgba(36, 26, 51, 0.9); border: 1px solid var(--accent);
            padding: 40px 30px; border-radius: 20px; text-align: center;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
            animation: slideUp 0.6s ease-out forwards;
            width: 90%; max-width: 350px;
        }
        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .login-box h2 { color: var(--accent); margin-bottom: 10px; font-size: 2rem; }
        .login-box p { color: var(--text-muted); margin-bottom: 20px; font-size: 14px; }
        .login-box input {
            width: 100%; padding: 12px 15px; border-radius: 10px; border: 1px solid var(--border);
            background: rgba(0,0,0,0.3); color: white; font-size: 16px; outline: none; margin-bottom: 15px;
            transition: 0.3s;
        }
        .login-box input:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(168, 85, 247, 0.3); }
        .login-btn {
            width: 100%; padding: 12px; border-radius: 10px; border: none;
            background: var(--accent); color: white; font-weight: bold; font-size: 16px;
            cursor: pointer; transition: 0.3s;
        }
        .login-btn:hover { background: #9333ea; transform: scale(1.02); }

        /* Sidebar Overlay */
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(3px); z-index: 45; opacity: 0; transition: opacity 0.3s; }
        .sidebar-overlay.show { display: block; opacity: 1; }

        /* Sidebar */
        .sidebar { width: 260px; background-color: var(--bg-sidebar); backdrop-filter: blur(15px); display: flex; flex-direction: column; padding: 15px 10px; border-right: 1px solid var(--border); z-index: 50; transition: transform 0.3s ease; }
        .user-profile { display: flex; align-items: center; gap: 10px; padding: 10px; background: rgba(42, 27, 61, 0.4); border-radius: 10px; margin-bottom: 15px; border: 1px solid var(--border); }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; color: white; }
        .user-name { font-weight: bold; font-size: 15px; color: var(--text-main); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .new-chat-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border: 1px solid var(--border); border-radius: 10px; color: var(--text-main); background: rgba(42, 27, 61, 0.6); cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.3s; margin-bottom: 15px; width: 100%; }
        .new-chat-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
        .sidebar-history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
        .history-item { padding: 10px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: 0.2s; border: 1px solid transparent; }
        .history-item:hover { background: rgba(42, 27, 61, 0.8); color: var(--text-main); }
        .history-item.active { background: rgba(168, 85, 247, 0.2); border-color: var(--accent); color: var(--text-main); }
        .sidebar-footer { padding-top: 15px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-muted); margin-top: auto; text-align: center; }
        
        .logout-btn { margin-top: 10px; background: transparent; border: 1px solid #ff4444; color: #ff4444; padding: 8px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 12px; transition: 0.3s; }
        .logout-btn:hover { background: #ff4444; color: white; }

        /* Header Mobile */
        .header-mobile { display: none; align-items: center; padding: 12px 15px; background: rgba(18, 12, 28, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); z-index: 40; width: 100%; flex-shrink: 0; }
        .menu-toggle { background: none; border: none; color: var(--accent); font-size: 28px; cursor: pointer; margin-right: 15px; padding: 0; line-height: 1; }
        .header-title { font-weight: bold; color: var(--text-main); font-size: 16px; }

        /* Main Chat */
        .main-chat { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 10; height: 100vh; overflow: hidden; display: none; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
        .message { display: flex; max-width: 800px; margin: 0 auto; width: 100%; gap: 12px; align-items: flex-end; }
        .message.user { justify-content: flex-end; flex-direction: row-reverse; }
        .message.ai { justify-content: flex-start; }
        .avatar-ai { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); box-shadow: 0 0 10px rgba(168, 85, 247, 0.5); flex-shrink: 0; margin-bottom: 5px; }
        
        .bubble { position: relative; padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.6; max-width: 85%; word-wrap: break-word; white-space: pre-wrap; box-shadow: 0 4px 15px rgba(0,0,0,0.4); overflow: hidden; display: flex; flex-direction: column; border: 1px solid var(--border); }
        .bubble::before { content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: -2; background-size: cover; background-position: center; background-attachment: fixed; opacity: 0.8; }
        .bubble::after { content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: -1; background: rgba(18, 12, 28, 0.65); backdrop-filter: blur(4px); }
        .bubble.ai::before { background-image: url('https://cdn.phototourl.com/member/2026-11-11-236aba0a-22c1-49fd-878c-9d2c4a9b3c6d.webp'); } 
        .bubble.user::before { background-image: url('https://cdn.phototourl.com/member/2026-11-11-236aba0a-22c1-49fd-878c-9d2c4a9b3c6d.webp'); } 
        .bubble.user { color: #fff; border-bottom-right-radius: 4px; }
        .bubble.ai { color: var(--text-main); border-bottom-left-radius: 4px; }
        .chat-text { flex: 1; position: relative; z-index: 1; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
        .chat-text a { color: #60a5fa; text-decoration: underline; word-break: break-all; }
        .chat-text video, .chat-text img { max-width: 100%; border-radius: 8px; margin-top: 8px; border: 1px solid var(--accent); }

        .animate-in { animation: epikFadeIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; transform: translateY(30px) scale(0.95); filter: blur(5px); }
        @keyframes epikFadeIn { 0% { opacity: 0; transform: translateY(30px) scale(0.95); filter: blur(5px); } 50% { opacity: 1; filter: blur(0px); } 100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0px); } }

        .input-container { padding: 10px 15px 15px 15px; width: 100%; max-width: 800px; margin: 0 auto; background: linear-gradient(to top, rgba(10, 6, 18, 1) 60%, transparent); z-index: 20; }
        .tools-bar { display: flex; gap: 8px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .tools-bar::-webkit-scrollbar { display: none; }
        
        .tool-btn { background: rgba(36, 26, 51, 0.8); color: var(--text-main); border: 1px solid var(--border); padding: 8px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; white-space: nowrap; transition: 0.3s; display: flex; align-items: center; gap: 6px; backdrop-filter: blur(5px); }
        .tool-btn:hover { background: var(--accent); border-color: var(--accent); transform: translateY(-2px); }
        .tool-btn.active { background: var(--accent); border-color: var(--accent); color: white; font-weight: bold; box-shadow: 0 0 10px rgba(168, 85, 247, 0.5); }

        .input-box { background: rgba(36, 26, 51, 0.8); backdrop-filter: blur(15px); border-radius: 16px; padding: 8px 12px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .input-box:focus-within { border-color: var(--accent); box-shadow: 0 0 20px rgba(168, 85, 247, 0.4); }
        
        textarea { flex: 1; background: transparent; border: none; color: var(--text-main); font-size: 15px; resize: none; max-height: 100px; outline: none; font-family: inherit; padding: 4px 0; }
        textarea::placeholder { color: var(--text-muted); }
        input[type="text"] { flex: 1; background: transparent; border: none; color: var(--text-main); font-size: 15px; outline: none; font-family: inherit; }
        select { background: rgba(0,0,0,0.3); color: var(--text-main); border: 1px solid var(--border); padding: 6px; border-radius: 8px; outline: none; font-family: inherit; font-size: 13px; }
        
        .action-btn { background: transparent; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; padding: 5px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .action-btn:hover { color: var(--accent); }
        
        .send-btn { background: var(--accent); color: white; border: none; width: 36px; height: 36px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; box-shadow: 0 0 10px rgba(168, 85, 247, 0.4); flex-shrink: 0; }
        .send-btn:hover { background: #9333ea; transform: scale(1.05); }
        .send-btn:disabled { background: #4c3a66; cursor: not-allowed; }

        .file-preview { display: none; margin-bottom: 8px; padding: 8px 12px; background: rgba(168, 85, 247, 0.2); border: 1px dashed var(--accent); border-radius: 8px; font-size: 13px; color: var(--accent); align-items: center; justify-content: space-between; }
        .file-preview span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80%; }
        .file-preview button { background: none; border: none; color: #ff4444; font-weight: bold; cursor: pointer; }

        .typing-dots { display: flex; gap: 5px; align-items: center; height: 24px; padding: 0 5px; position: relative; z-index: 1; }
        .dot { width: 7px; height: 7px; background: var(--accent); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; } .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); box-shadow: 2px 0 15px rgba(0,0,0,0.8); }
            .sidebar.open { transform: translateX(0); }
            .header-mobile { display: flex; }
            .main-chat { height: calc(100vh - 60px); width: 100%; }
            .chat-container { padding-bottom: 10px; }
        }
    </style>
</head>
<body>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const inputBox = document.getElementById('dynamicInputBox');
        const footerText = document.getElementById('footerText');
        const historyList = document.getElementById('historyList');
        const filePreview = document.getElementById('filePreview');
        const fileName = document.getElementById('fileName');
        
        const API_KEY = "kyzz119190745866";
        const FOTO_AI = "https://cdn.phototourl.com/member/2026-11-11-236aba0a-22c1-49fd-878c-9d2c4a9b3c6d.webp";

        let isTyping = false;
        let currentAIModel = "ishimi"; 
        let currentToolMode = "chat"; 
        let selectedHDResolution = "1080"; 
        let selectedVideoBase64 = null;
        let attachedFileBase64 = null; 

        let chatThreads = {};
        let activeThreadId = "";
        let currentUser = "";

        // ============ LOGIKA LOGIN & SPLASH ============
        window.addEventListener('load', () => {
            // Efek Splash Screen (2 detik)
            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    
                    // Cek apakah udah pernah login
                    const savedUser = localStorage.getItem('ishimi_user');
                    if(savedUser) {
                        currentUser = savedUser;
                        loginSuccess();
                    } else {
                        // Tampilkan Login
                        const loginScr = document.getElementById('loginScreen');
                        loginScr.style.display = 'flex';
                        setTimeout(() => loginScr.style.opacity = '1', 50);
                    }
                }, 800);
            }, 1500);
        });

        function login() {
            const name = document.getElementById('usernameInput').value.trim();
            if(!name) return alert("Nama gak boleh kosong, Bro!");
            
            currentUser = name;
            localStorage.setItem('ishimi_user', name);
            loginSuccess();
        }

        function loginSuccess() {
            // Sembunyiin login screen
            const loginScr = document.getElementById('loginScreen');
            loginScr.style.opacity = '0';
            setTimeout(() => loginScr.style.display = 'none', 500);

            // Munculin chat
            const mainChat = document.getElementById('mainChat');
            mainChat.style.display = 'flex';

            // Set Profil Sidebar
            document.getElementById('userNameDisplay').innerText = currentUser;
            document.getElementById('userAvatar').innerText = currentUser.charAt(0).toUpperCase();

            // Init App
            initApp();
            renderInputArea();
        }

        function logout() {
            localStorage.removeItem('ishimi_user');
            location.reload();
        }

        // ============ SIDEBAR MOBILE ============
        function toggleSidebar() {
